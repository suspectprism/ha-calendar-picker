<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Calendar Picker Mock-up</title>
<style>
  body { margin: 0; padding: 16px; font-family: Roboto, "Segoe UI", sans-serif; background: #333; color: #eee; }
  h2 { font-weight: 400; margin: 8px 0 12px; font-size: 1.1rem; }
  .row { display: flex; gap: 16px; flex-wrap: wrap; align-items: flex-start; margin-bottom: 28px; }
  .dark, .light { padding: 12px; }
  .dark {
    --primary-text-color: #e1e1e1; --secondary-text-color: #9b9b9b;
    --card-background-color: #1c1c1c; --divider-color: rgba(225,225,225,0.12);
    --error-color: #db4437; --info-color: #039be5; background: #111111;
  }
  .light {
    --primary-text-color: #212121; --secondary-text-color: #727272;
    --card-background-color: #ffffff; --divider-color: rgba(0,0,0,0.12);
    --error-color: #db4437; --info-color: #039be5; background: #fafafa;
  }
  .label { font-size: 0.75rem; opacity: 0.7; margin-bottom: 6px; }
  .light .label { color: #333; }
  .desk { width: 480px; } .phone { width: 360px; }
  body.shot { padding: 0; background: transparent; }
  body.shot .row { margin: 0; }
  body.shot .label { display: none; }
</style>
<script>
  customElements.define("ha-card", class extends HTMLElement {
    constructor() {
      super();
      this.attachShadow({ mode: "open" }).innerHTML =
        `<style>:host{display:block;background:var(--ha-card-background,var(--card-background-color));border:1px solid var(--divider-color);border-radius:12px;}</style><slot></slot>`;
    }
  });
</script>
<script src="../dist/ha-calendar-picker.js"></script>
</head>
<body>
<div id="root"></div>
<script>
  const fmt = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
  const rel = n => { const d = new Date(); d.setDate(d.getDate() + n); return fmt(d); };

  // Mock HA: calendar events, live sensor states, and recorder statistics.
  const RAIN_ENTITY = "sensor.mock_rainfall_today";
  const BOM_PREFIX  = "sensor.mock";

  // Today: real values for 3 Oct 2026 (15–30 forecast, 31 actual). Others illustrative.
  const OBSERVED = { [-1]: 2.6, [-2]: 0.4, [-5]: 12.3, [-9]: 0.2, [-20]: 7.94, [-33]: 18 };
  const FORECAST = [[15, 30], [5, 10], [0, 1], [0, 0], [0, 5], [0, 0], [1, 5]];

  function mockHass(eventOffsets, { rain = true } = {}) {
    const events = eventOffsets.map((n, i) => ({ uid: "u" + i, start: { dateTime: rel(n) + "T00:00:00" } }));
    const states = {};
    if (rain) {
      states[RAIN_ENTITY] = { state: "31" };
      FORECAST.forEach(([min, max], n) => {
        const date = rel(n) + "T00:00:00+10:00";
        states[`${BOM_PREFIX}_rain_amount_min_${n}`] = { state: String(min), attributes: { date } };
        states[`${BOM_PREFIX}_rain_amount_max_${n}`] = { state: String(max), attributes: { date } };
      });
    }
    return {
      states,
      services: {},
      async callApi() { return events; },
      async callService() {},
      async callWS(msg) {
        if (msg.type !== "recorder/statistics_during_period") throw new Error("unexpected " + msg.type);
        const rows = Object.entries(OBSERVED).map(([n, change]) => {
          const d = new Date(); d.setHours(0, 0, 0, 0); d.setDate(d.getDate() + +n);
          return { start: d.getTime(), end: d.getTime() + 864e5, change };
        });
        // A partial row for today, which the card must ignore in favour of the live state.
        const t = new Date(); t.setHours(0, 0, 0, 0);
        rows.push({ start: t.getTime(), end: t.getTime() + 864e5, change: 20 });
        return { [msg.statistic_ids[0]]: rows };
      },
    };
  }

  const WATER = { title: "Watering Schedule", icon: "💧", summary_title: "Upcoming watering days",
                  rain_entity: RAIN_ENTITY, rain_forecast_prefix: BOM_PREFIX };
  const cards = [
    { theme: "dark",  size: "desk",  label: "Desktop · dark · watering + rain", cfg: WATER, events: [-5, -1, 0, 4, 7] },
    { theme: "dark",  size: "phone", label: "Phone · dark · watering + rain",   cfg: WATER, events: [-5, -1, 0, 4, 7] },
    { theme: "light", size: "phone", label: "Phone · light · watering + rain",  cfg: WATER, events: [-5, -1, 0, 4, 7] },
    { theme: "light", size: "phone", label: "Phone · light · bins (no rain config)",
      cfg: { title: "Bin Collection", icon: "🗑️", accent_color: "#a0c4ff" }, events: [-7, 0, 7], rain: false },
  ];

  // ?only=N renders just card N with no label, for README screenshots.
  const only = new URLSearchParams(location.search).get("only");
  if (only !== null) document.body.classList.add("shot");

  const row = document.createElement("div");
  row.className = "row";
  document.getElementById("root").appendChild(row);
  for (const c of only !== null ? [cards[+only]] : cards) {
    const wrap = document.createElement("div");
    wrap.className = c.theme;
    wrap.innerHTML = `<div class="label">${c.label}</div><div class="${c.size}"></div>`;
    row.appendChild(wrap);
    const el = document.createElement("ha-calendar-picker");
    el.setConfig({ entity: "calendar.mock", ...c.cfg });
    el.hass = mockHass(c.events, { rain: c.rain !== false });
    wrap.lastElementChild.appendChild(el);
  }
</script>
</body>
</html>
